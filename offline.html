<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Нет интернета — QUATT QURYLYS</title>
  <style>
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff;display:grid;place-items:center;min-height:100vh;padding:24px}
    .box{max-width:420px;width:100%;background:#181818;border:1px solid #2a2a2a;border-radius:24px;padding:28px 22px;text-align:center;box-shadow:0 20px 48px rgba(0,0,0,.28)}
    .logo{width:88px;height:88px;border-radius:24px;background:#f5c400;color:#111;display:grid;place-items:center;font-size:52px;font-weight:900;margin:0 auto 18px}
    h1{font-size:24px;line-height:1.2;margin:0 0 10px}
    p{margin:0 0 8px;color:rgba(255,255,255,.72);line-height:1.5}
    button{margin-top:18px;border:0;border-radius:14px;background:#f5c400;color:#111;padding:14px 18px;font-weight:800;font-size:15px;cursor:pointer}
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">Q</div>
    <h1>Нет подключения к интернету</h1>
    <p>Проверьте сеть и попробуйте открыть каталог ещё раз.</p>
    <p>Как только интернет появится, сайт снова заработает автоматически.</p>
    <button onclick="location.reload()">Повторить</button>
  </div>
</body>
</html>
